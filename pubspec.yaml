name: notion_clone
description: A Notion-like productivity app built in Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  flutter_markdown: ^0.6.18
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.0.3
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  sqflite: ^2.3.2
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
